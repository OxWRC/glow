# Test-specific overrides for compose.yml.
# Usage: docker compose -f compose.yml -f compose.test.yml up

services:
  api:
    environment:
      GLOW_SECRET_KEY: smoke-test-secret
      GLOW_CORS_ORIGINS: '["http://127.0.0.1:3000"]'
      # compose.yml's default GLOW_ODK_API_URL (http://odk-service:8383,
      # internal plain HTTP) is rejected by ODK Central for Basic Auth
      # ("This authentication method is only available over HTTPS", 401.3) --
      # go through nginx's TLS termination instead, matching dev.
      GLOW_ODK_API_URL: https://nginx
      GLOW_ODK_HOST_HEADER: odk.local
      GLOW_ODK_API_EMAIL: api@glow.local
      GLOW_ODK_API_PASSWORD: devpassword
      GLOW_ODK_VERIFY_SSL: "false"
      # No real Cognito pool in CI: without this, _build_verifier() raises
      # at import time (neither a pool nor the bypass is configured) and the
      # api container never boots. smoke_compose.sh and smoke.spec.ts both
      # log in via /demo/login, which only exists when this is set.
      GLOW_DEMO_MODE: "true"
      # Shared with glow-init below so its own fresh DataStore can pick up
      # this container's already-fetched data instead of racing its own ODK
      # fetch (neither container has a bind-mounted source tree in CI to
      # share it "for free" the way compose.override.yml's dev glow-init does).
      GLOW_DATA_CACHE_PATH: /cache/data.parquet
      # No real AWS account in CI: point the vintages S3 client at the
      # s3mock service below instead. get_s3_client() is a bare
      # boto3.client("s3", ...) call, so these are read straight off boto3's
      # own standard env vars / credential chain, not through Settings.
      # An explicit endpoint_url also makes botocore default to path-style
      # addressing, which is what a non-AWS host like s3mock needs.
      GLOW_VINTAGES_S3_BUCKET: glow-vintages-test
      GLOW_AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: glow-test
      AWS_SECRET_ACCESS_KEY: glow-test-secret
      AWS_ENDPOINT_URL_S3: http://s3mock:9090
    volumes:
      - glow_cache:/cache
    networks:
      - vintages_s3
    depends_on:
      s3mock:
        condition: service_healthy
    healthcheck:
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: "no"

  api-db:
    restart: "no"

  # Local S3-compatible store for the vintages feature (glow_api.vintages),
  # which has no DB table and treats S3 as its only source of truth. Real
  # deploys get a Terraform-provisioned bucket (deploy/aws/terraform/s3.tf);
  # CI has no AWS account, so the api container's cut_vintage /
  # list_vintages calls need something to hit instead, or they 500 the way
  # they did before this existed. initial-buckets auto-creates the bucket
  # named below on startup, so nothing else has to create it.
  s3mock:
    image: adobe/s3mock:5.2.3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIALBUCKETS: glow-vintages-test
    networks:
      - vintages_s3
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: "no"

  dashboard:
    environment:
      PUBLIC_API_BASE: http://127.0.0.1:8000
      # Login form is gone (Cognito hosted UI replaced it); CI has no real
      # pool, so smoke.spec.ts drives the demo-mode role picker instead.
      PUBLIC_DEMO_MODE: "true"
    restart: "no"
    depends_on:
      glow-init:
        condition: service_completed_successfully

  postgres14:
    build:
      target: dev
    restart: "no"

  glow-init:
    extends:
      file: compose.glow-init.yml
      service: glow-init
    environment:
      GLOW_METADATA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-glow}:${POSTGRES_PASSWORD:-change-me-in-production}@api-db:5432/${POSTGRES_DB:-glow}
      GLOW_CONNECTED_SCHOOL: ${PLAYWRIGHT_SCOPED_SCHOOL:-Beahanberg High School}
      GLOW_DATA_CACHE_PATH: /cache/data.parquet
    volumes:
      - glow_cache:/cache
    depends_on:
      api:
        condition: service_healthy
    networks:
      - api_db
      - public
    command:
      - sh
      - -c
      - |
        set -eu
        echo "Waiting for api's first counts poll to reach cache..."
        for i in $$(seq 1 60); do
          [ -s "$$GLOW_DATA_CACHE_PATH" ] && break
          if [ "$$i" -eq 60 ]; then
            echo "Timed out waiting for $$GLOW_DATA_CACHE_PATH" >&2
            exit 1
          fi
          sleep 2
        done
        # Wipe + re-seed: School records from the ODK-seeded data (one per
        # distinct raw "school" value, keyed by odk_school_id) plus `admin`.
        glow-api demo reset
        # Focus School Academy / Neighbouring School are deliberately *not*
        # linked to any ODK data -- they exercise the "school onboarded in
        # GLOW but not yet connected to ODK" path (empty query results, not
        # an error).
        glow-api schools create "Focus School Academy" || true
        glow-api schools create "Neighbouring School" || true
        # /me returns exactly a user's assigned schools (no implicit "admin
        # sees everything" expansion), so admin needs the connected school
        # assigned too for the dashboard's school picker to offer it.
        ADMIN_SCHOOLS="Focus School Academy,Neighbouring School,$$GLOW_CONNECTED_SCHOOL"
        glow-api users create --admin --schools "$$ADMIN_SCHOOLS" admin || \
          glow-api users update --schools "$$ADMIN_SCHOOLS" --active admin
        # alpha-user is scoped to a real, ODK-connected school so its query
        # smoke test exercises actual data, not just auth plumbing.
        glow-api users create --schools "$$GLOW_CONNECTED_SCHOOL" alpha-user || \
          glow-api users update --schools "$$GLOW_CONNECTED_SCHOOL" --active alpha-user

volumes:
  glow_cache:

networks:
  vintages_s3:
