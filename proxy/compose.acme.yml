# Mounted via `extends` from compose.yml's proxy service (see there).
services:
  proxy-networks:
    ports:
      - "${GLOW_HTTPS_PORT:-443}:443"
    networks:
      public:
        aliases:
          - ${GLOW_DOMAIN:-localhost}
          - api.${GLOW_DOMAIN:-localhost}
          - odk.${GLOW_DOMAIN:-localhost}
