# Production-like core stack.
# Glow and ODK Central services all run by default; Caddy `proxy` is the only
# published service in production.

# Mounts with a ${VAR:-default} source use long syntax: some compose versions
# split short syntax on every ':' under `config --no-interpolate` (release staging).
x-bind: &bind
  type: bind
  bind:
    create_host_path: true

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  api:
    logging: *default-logging
    image: ${GLOW_REGISTRY:-ghcr.io/oxwrc}/glow-api:${GLOW_VERSION:-dev}
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      GLOW_TESTING: ${GLOW_TESTING:-}
      GLOW_ALEMBIC_INI: /app/alembic.ini
      GLOW_ODK_API_URL: ${GLOW_ODK_API_URL:-http://nginx}
      GLOW_ODK_HOST_HEADER: ${GLOW_ODK_HOST_HEADER:-odk.${GLOW_DOMAIN:-localhost}}
      GLOW_ODK_API_EMAIL: ${GLOW_ODK_API_EMAIL:-}
      GLOW_ODK_API_PASSWORD: ${GLOW_ODK_API_PASSWORD:-}
      GLOW_ODK_PROJECT_ID: ${GLOW_ODK_PROJECT_ID:-1}
      GLOW_ODK_FORM_ID: ${GLOW_ODK_FORM_ID:-bewell_questionnaire}
      GLOW_ODK_VERIFY_SSL: ${GLOW_ODK_VERIFY_SSL:-true}
      GLOW_DATA_CACHE_PATH: ${GLOW_DATA_CACHE_PATH:-.cache.parquet}
      GLOW_DATA_REFRESH_HOURS: ${GLOW_DATA_REFRESH_HOURS:-1}
      GLOW_MIN_N: ${GLOW_MIN_N:-5}
      GLOW_SECRET_KEY: ${GLOW_SECRET_KEY:-change-me-in-production}
      # Safe-by-default: this is the base/production compose file, so an
      # unset GLOW_DEMO_MODE must NOT enable dev-mode auth. Local dev
      # opts in via compose.override.yml, which is never applied on a real
      # deploy.
      GLOW_DEMO_MODE: ${GLOW_DEMO_MODE:-false}
      # Passthrough only - no `:-` default. An empty-string default would be
      # just as falsy as unset at auth.py's _build_verifier() check, but it
      # would also swallow Compose's own "variable is not set" warning, the
      # one operator-visible signal that these were left out of a real
      # deploy's .env.runtime. Populating .env.runtime with real values is a
      # separate, later task; this just gives them a path into the container.
      GLOW_OIDC_ISSUER: ${GLOW_OIDC_ISSUER}
      GLOW_OIDC_CLIENT_ID: ${GLOW_OIDC_CLIENT_ID}
      GLOW_VINTAGES_DIR: /var/lib/glow-vintages
      GLOW_PERIOD_TIMEZONE: ${GLOW_PERIOD_TIMEZONE:-Europe/London}
      GLOW_APP_VERSION: ${APP_VERSION:-dev}
      GLOW_METADATA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-glow}:${POSTGRES_PASSWORD:-change-me-in-production}@api-db:5432/${POSTGRES_DB:-glow}
      GLOW_CORS_ORIGINS: ${GLOW_CORS_ORIGINS:-["https://${GLOW_DOMAIN:-localhost}"]}
      # Claim links for admin-issued API keys are emailed through the same
      # relay as ODK; unset host makes issuing a key fail with 503.
      GLOW_DASHBOARD_URL: https://${GLOW_DOMAIN:-localhost}
      GLOW_SMTP_FROM: ${GLOW_SMTP_FROM:-no-reply@${GLOW_DOMAIN:-localhost}}
      GLOW_SMTP_HOST: ${GLOW_SMTP_HOST:-}
      GLOW_SMTP_PORT: ${GLOW_SMTP_PORT:-587}
      GLOW_SMTP_SECURE: ${GLOW_SMTP_SECURE:-false}
      GLOW_SMTP_USER: ${GLOW_SMTP_USER:-}
      GLOW_SMTP_PASSWORD: ${GLOW_SMTP_PASSWORD:-}
    volumes:
      - {<<: *bind, source: "${GLOW_STATE_DIR:-./docker-mount-data}/vintages", target: /var/lib/glow-vintages}
    depends_on:
      api-db:
        condition: service_healthy
      odk-service:
        condition: service_started
      nginx:
        condition: service_healthy
    networks:
      - public
      - api_db
      - dashboard_api
      - odk_api
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  api-db:
    logging: *default-logging
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-glow}
      POSTGRES_USER: ${POSTGRES_USER:-glow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
    volumes:
      - {<<: *bind, source: "${GLOW_STATE_DIR:-./docker-mount-data}/glow-postgres", target: /var/lib/postgresql/data}
    networks:
      - api_db
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-glow} -d ${POSTGRES_DB:-glow}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Hourly encrypted restic backups of both DBs and the state files (see
  # backup/glow-backup.sh). Production only: compose.demo.yml disables it.
  # State is mounted read-only; only <state>/backup-status (status file, written
  # by atomic rename) is writable. /tmp is tmpfs so DB dumps (personal data)
  # never touch the container's disk.
  backup:
    logging: *default-logging
    image: ${GLOW_REGISTRY:-ghcr.io/oxwrc}/glow-backup:${GLOW_VERSION:-dev}
    build:
      context: ./backup
      dockerfile: Dockerfile
    init: true
    # tmpfs counts against memory: it is bounded so an oversized dump fails as a
    # recorded backup error, not an OOM kill. Raise it with GLOW_BACKUP_TMPFS_SIZE
    # (a compose-level override only; not a glow.env key).
    tmpfs:
      - /tmp:size=${GLOW_BACKUP_TMPFS_SIZE:-2g},mode=1777
      # The postgres base image declares this VOLUME; unused here. Covering
      # it stops Docker leaving an anonymous volume behind per container.
      - /var/lib/postgresql/data:size=1m
    environment:
      GLOW_BACKUP_FIRST_DELAY: ${GLOW_BACKUP_FIRST_DELAY:-300}
      GLOW_BACKUP_INTERVAL: ${GLOW_BACKUP_INTERVAL:-3600}
      RESTIC_REPOSITORY: /backup
      RESTIC_CACHE_DIR: /cache
      RESTIC_PASSWORD: ${GLOW_BACKUP_KEY:-}
      POSTGRES_HOST: api-db
      POSTGRES_DB: ${POSTGRES_DB:-glow}
      POSTGRES_USER: ${POSTGRES_USER:-glow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
      ODK_POSTGRES_HOST: postgres14
      ODK_POSTGRES_DB: ${ODK_POSTGRES_DB:-odk}
      ODK_POSTGRES_USER: ${ODK_POSTGRES_USER:-odk}
      ODK_POSTGRES_PASSWORD: ${ODK_POSTGRES_PASSWORD:-odk}
    volumes:
      - backup_cache:/cache
      - type: bind
        source: ${GLOW_BACKUP_PATH:-${GLOW_STATE_DIR:-./docker-mount-data}/backups}
        target: /backup
        bind:
          create_host_path: true
      - {<<: *bind, source: "${GLOW_STATE_DIR:-./docker-mount-data}", target: /state, read_only: true}
      - {<<: *bind, source: "${GLOW_STATE_DIR:-./docker-mount-data}/backup-status", target: /state/backup-status}
      - {<<: *bind, source: "${GLOW_ENV_FILE:-./glow.env}", target: /release/glow.env, read_only: true}
    depends_on:
      api-db:
        condition: service_healthy
      postgres14:
        condition: service_healthy
    networks:
      - api_db
      - odk_internal
    restart: unless-stopped

  dashboard:
    logging: *default-logging
    image: ${GLOW_REGISTRY:-ghcr.io/oxwrc}/glow-dashboard:${GLOW_VERSION:-dev}
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PUBLIC_API_BASE: ${PUBLIC_API_BASE:-https://api.${GLOW_DOMAIN:-localhost}}
      # Passthrough only - no `:-` default, same reasoning as the api
      # service's GLOW_OIDC_* vars above: there is no working default
      # client/issuer, so an empty-string default would just
      # silently swallow Compose's own "variable is not set" warning.
      PUBLIC_OIDC_ISSUER: ${GLOW_OIDC_ISSUER}
      PUBLIC_OIDC_CLIENT_ID: ${GLOW_OIDC_CLIENT_ID}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - public
      - dashboard_api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/en/login"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # The only service that publishes host ports. Routes by hostname:
  #   ${GLOW_DOMAIN}      -> dashboard
  #   api.${GLOW_DOMAIN}  -> api
  #   odk.${GLOW_DOMAIN}  -> ODK Central's nginx (SSL_TYPE=upstream: plain HTTP
  #                          behind this proxy, which terminates TLS)
  # GLOW_TLS_MODE picks the Caddyfile: acme (default), files, or off.
  proxy:
    logging: *default-logging
    image: caddy:2.10.2
    environment:
      GLOW_DOMAIN: ${GLOW_DOMAIN:-localhost}
      GLOW_ACME_EMAIL_DIRECTIVE: ${GLOW_ACME_EMAIL:+email ${GLOW_ACME_EMAIL}}
    volumes:
      - {type: bind, source: "./proxy/Caddyfile.${GLOW_TLS_MODE:-acme}", target: /etc/caddy/Caddyfile, read_only: true}
      - {<<: *bind, source: "${GLOW_TLS_CERT_DIR:-./proxy/certs}", target: /certs, read_only: true}
      - {<<: *bind, source: "${GLOW_STATE_DIR:-./docker-mount-data}/caddy-data", target: /data}
    ports:
      - "${GLOW_HTTP_PORT:-80}:80"
    # Network aliases and the HTTPS port mapping come from
    # proxy/compose.${GLOW_TLS_MODE}.yml. In acme and files modes the proxy answers to the three hostnames on `public`, so
    # Enketo's fetch of https://odk.<domain> hairpins to Caddy. In off mode
    # Caddy has no :443, so no aliases and no 443 mapping (the operator's own
    # terminator owns it): Enketo must reach https://odk.<domain>
    # (the operator's TLS terminator) via normal DNS.
    extends:
      file: proxy/compose.${GLOW_TLS_MODE:-acme}.yml
      service: proxy-networks
    restart: unless-stopped

  postgres14:
    logging: *default-logging
    image: ${GLOW_REGISTRY:-ghcr.io/oxwrc}/glow-odk-postgres:${GLOW_VERSION:-dev}
    build:
      context: ./odk-central/postgres
      target: base
    environment:
      POSTGRES_DB: ${ODK_POSTGRES_DB:-odk}
      POSTGRES_USER: ${ODK_POSTGRES_USER:-odk}
      POSTGRES_PASSWORD: ${ODK_POSTGRES_PASSWORD:-odk}
    volumes:
      - {<<: *bind, source: "${GLOW_STATE_DIR:-./docker-mount-data}/odk-postgres", target: /var/lib/postgresql/data}
    networks:
      - odk_internal
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${ODK_POSTGRES_USER:-odk} -d ${ODK_POSTGRES_DB:-odk}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  secrets:
    logging: *default-logging
    image: busybox:1.36
    network_mode: none
    command:
      - /bin/sh
      - -ceu
      - |
        if [ ! -f /etc/secrets/enketo-secret ]; then
          head -c1024 /dev/urandom | tr -dc '[:alnum:]' | head -c64 > /etc/secrets/enketo-secret
        fi
        if [ ! -f /etc/secrets/enketo-less-secret ]; then
          head -c512 /dev/urandom | tr -dc '[:alnum:]' | head -c32 > /etc/secrets/enketo-less-secret
        fi
        if [ ! -f /etc/secrets/enketo-api-key ]; then
          head -c2048 /dev/urandom | tr -dc '[:alnum:]' | head -c128 > /etc/secrets/enketo-api-key
        fi
        exec tail -f /dev/null
    volumes:
      - {<<: *bind, source: "${GLOW_STATE_DIR:-./docker-mount-data}/odk-secrets", target: /etc/secrets}
    healthcheck:
      test:
        - CMD
        - /bin/sh
        - -c
        - test -s /etc/secrets/enketo-secret && test -s /etc/secrets/enketo-less-secret && test -s /etc/secrets/enketo-api-key
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 1s
    restart: unless-stopped

  pyxform:
    logging: *default-logging
    image: ghcr.io/getodk/pyxform-http:v4.4.1
    networks:
      - odk_internal
    restart: unless-stopped

  enketo:
    logging: *default-logging
    image: ${GLOW_REGISTRY:-ghcr.io/oxwrc}/glow-enketo:${GLOW_VERSION:-dev}
    build:
      context: ./odk-central/enketo
      dockerfile: Dockerfile
    depends_on:
      secrets:
        condition: service_healthy
      enketo_redis_main:
        condition: service_started
      enketo_redis_cache:
        condition: service_started
    environment:
      DOMAIN: ${ODK_DOMAIN:-odk.${GLOW_DOMAIN:-localhost}}
      HTTPS_PORT: ${ODK_PUBLIC_HTTPS_PORT:-443}
      SUPPORT_EMAIL: ${ODK_SYSADMIN_EMAIL:-admin@example.com}
    volumes:
      - {<<: *bind, source: "${GLOW_STATE_DIR:-./docker-mount-data}/odk-secrets", target: /etc/secrets}
    networks:
      # public: Enketo fetches forms from Central's public URL
      # (https://${ODK_DOMAIN}), which odk_internal can't resolve or reach.
      - public
      - odk_internal
    restart: unless-stopped

  enketo_redis_main:
    logging: *default-logging
    image: redis:8.6.2
    volumes:
      - ./odk-central/redis/redis-enketo-main.conf:/usr/local/etc/redis/redis.conf:ro
      - {<<: *bind, source: "${GLOW_STATE_DIR:-./docker-mount-data}/odk-enketo-redis-main", target: /data}
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
    networks:
      - odk_internal
    restart: unless-stopped

  enketo_redis_cache:
    logging: *default-logging
    image: redis:8.6.2
    volumes:
      - ./odk-central/redis/redis-enketo-cache.conf:/usr/local/etc/redis/redis.conf:ro
      - {<<: *bind, source: "${GLOW_STATE_DIR:-./docker-mount-data}/odk-enketo-redis-cache", target: /data}
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
    networks:
      - odk_internal
    restart: unless-stopped

  odk-service:
    logging: *default-logging
    image: ghcr.io/getodk/central-service:${ODK_CENTRAL_TAG:-v2026.1.2}
    depends_on:
      postgres14:
        condition: service_healthy
      secrets:
        condition: service_healthy
      pyxform:
        condition: service_started
      enketo:
        condition: service_started
    command: ["/usr/odk/start-odk.sh"]
    environment:
      DOMAIN: ${ODK_DOMAIN:-odk.${GLOW_DOMAIN:-localhost}}
      SYSADMIN_EMAIL: ${ODK_SYSADMIN_EMAIL:-admin@example.com}
      HTTPS_PORT: ${ODK_PUBLIC_HTTPS_PORT:-443}
      PGHOST: postgres14
      PGDATABASE: ${ODK_POSTGRES_DB:-odk}
      PGUSER: ${ODK_POSTGRES_USER:-odk}
      PGPASSWORD: ${ODK_POSTGRES_PASSWORD:-odk}
      PGAPPNAME: odkcentral
      DB_POOL_SIZE: ${ODK_DB_POOL_SIZE:-10}
      # Outbound mail: set GLOW_SMTP_* for a real relay. Unset host leaves
      # ODK running but unable to send mail (dev/test/demo overlays add mailpit).
      EMAIL_FROM: ${GLOW_SMTP_FROM:-no-reply@${GLOW_DOMAIN:-localhost}}
      EMAIL_HOST: ${GLOW_SMTP_HOST:-}
      EMAIL_PORT: ${GLOW_SMTP_PORT:-587}
      EMAIL_SECURE: ${GLOW_SMTP_SECURE:-false}
      EMAIL_IGNORE_TLS: "false"
      EMAIL_USER: ${GLOW_SMTP_USER:-}
      EMAIL_PASSWORD: ${GLOW_SMTP_PASSWORD:-}
      OIDC_ENABLED: ${ODK_OIDC_ENABLED:-false}
      OIDC_ISSUER_URL: ${ODK_OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${ODK_OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${ODK_OIDC_CLIENT_SECRET:-}
      # Telemetry off: ODK's start script requires these variables to be
      # defined, and an empty key/project/subdomain makes Central skip
      # Sentry.init entirely (lib/external/sentry.js). Error reports can
      # carry request data, so nothing may leave the deployment.
      SENTRY_ORG_SUBDOMAIN: ${ODK_SENTRY_ORG_SUBDOMAIN:-}
      SENTRY_KEY: ${ODK_SENTRY_KEY:-}
      SENTRY_PROJECT: ${ODK_SENTRY_PROJECT:-}
      SENTRY_TRACE_RATE: ${ODK_SENTRY_TRACE_RATE:-0}
      # Selects config/local-glow.json (mounted below), which blanks the
      # data.getodk.cloud analytics and mailing-list URLs.
      NODE_CONFIG_ENV: glow
      S3_SERVER: ${ODK_S3_SERVER:-}
      S3_ACCESS_KEY: ${ODK_S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${ODK_S3_SECRET_KEY:-}
      S3_BUCKET_NAME: ${ODK_S3_BUCKET_NAME:-}
      SESSION_LIFETIME: ${ODK_SESSION_LIFETIME:-86400}
    volumes:
      - {<<: *bind, source: "${GLOW_STATE_DIR:-./docker-mount-data}/odk-secrets", target: /etc/secrets}
      - {<<: *bind, source: "${GLOW_STATE_DIR:-./docker-mount-data}/odk-transfer", target: /data/transfer}
      - ./odk-central/local-glow.json:/usr/odk/config/local-glow.json:ro
    networks:
      odk_internal:
        aliases:
          - service
      odk_api:
    restart: unless-stopped

  nginx:
    logging: *default-logging
    image: ghcr.io/getodk/central-nginx:${ODK_CENTRAL_TAG:-v2026.1.2}
    depends_on:
      odk-service:
        condition: service_started
      enketo:
        condition: service_started
    environment:
      DOMAIN: ${ODK_DOMAIN:-odk.${GLOW_DOMAIN:-localhost}}
      EXTRA_SERVER_NAMES: ${ODK_EXTRA_SERVER_NAMES:-}
      CERTBOT_EMAIL: ${ODK_SYSADMIN_EMAIL:-admin@example.com}
      SSL_TYPE: ${ODK_SSL_TYPE:-upstream}
      OIDC_ENABLED: ${ODK_OIDC_ENABLED:-false}
      # Sentry vars deliberately absent: the central-nginx image and our
      # odk.conf.template no longer reference them (CSP reports are
      # swallowed locally by /csp-report).
    volumes:
      - ./odk-central/nginx/odk.conf.template:/usr/share/odk/nginx/odk.conf.template:ro
      - ./odk-central/nginx/redirector.conf:/usr/share/odk/nginx/redirector.conf:ro
      - ./odk-central/nginx/client-config.json.template:/usr/share/odk/nginx/client-config.json.template:ro
      # The image declares these VOLUMEs; bound so no anonymous volumes pile
      # up, and the dhparam (slow to generate) survives container recreation.
      - {<<: *bind, source: "${GLOW_STATE_DIR:-./docker-mount-data}/odk-nginx-dh", target: /etc/dh}
      - {<<: *bind, source: "${GLOW_STATE_DIR:-./docker-mount-data}/odk-nginx-letsencrypt", target: /etc/letsencrypt}
      - {<<: *bind, source: "${GLOW_STATE_DIR:-./docker-mount-data}/odk-nginx-selfsign", target: /etc/selfsign}
    networks:
      - public
      - odk_internal
    healthcheck:
      test:
        - CMD-SHELL
        - nc -z localhost 80 || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      # First boot runs `openssl dhparam 2048`, whose runtime is random and
      # can exceed two minutes on a CI runner. Poll quickly during a long
      # start period so a fast boot still goes healthy within seconds.
      start_period: 300s
      start_interval: 5s
    restart: unless-stopped

volumes:
  backup_cache:

networks:
  public:
  api_db:
    internal: true
  dashboard_api:
    internal: true
  odk_api:
    internal: true
  odk_internal:
    internal: true
