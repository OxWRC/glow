[project]
name = "glow-aws-deploy"
version = "0.0.4"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35.0",
    "httpx>=0.27.0",
    "keyring>=25.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.12",
]

[project.scripts]
glow-deploy = "glow_deploy.core:main"
glow-deploy-gui = "glow_deploy.gui.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pyinstaller>=6.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
