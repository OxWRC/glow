# Development overrides for compose.yml.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # Dev publishes service ports directly and skips the proxy; run it with
  # `docker compose --profile proxy up` to try the production routing.
  proxy:
    profiles: [proxy]

  api:
    ports:
      - "8000:8000"
    working_dir: /app
    volumes:
      - ./data:/data
      - ./api:/app
    environment:
      GLOW_CORS_ORIGINS: ${GLOW_CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}
      # Fixed dev-only ODK creds -- match the admin/API users baked into
      # postgres14's dev image (see odk-central/postgres/README.md). Basic
      # Auth requires HTTPS, so this goes through nginx, not odk-service
      # directly.
      GLOW_ODK_API_URL: https://nginx
      GLOW_ODK_HOST_HEADER: odk.local
      GLOW_ODK_API_EMAIL: api@glow.local
      GLOW_ODK_API_PASSWORD: devpassword
      GLOW_ODK_VERIFY_SSL: "false"
      # Dev-only: mints local tokens via /demo/login instead of requiring
      # a real identity provider for local dev/demo.
      GLOW_DEMO_MODE: "true"

  glow-init:
    extends:
      file: compose.glow-init.yml
      service: glow-init
    working_dir: /app
    volumes:
      - ./api:/app
      - ${GLOW_STATE_DIR:-./docker-mount-data}/vintages:/var/lib/glow-vintages
    environment:
      GLOW_VINTAGES_DIR: /var/lib/glow-vintages
      GLOW_METADATA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-glow}:${POSTGRES_PASSWORD:-change-me-in-production}@api-db:5432/${POSTGRES_DB:-glow}
      # Same counts cache file api itself writes to (shared via the /app bind
      # mount above) -- lets `demo reset` seed schools from api's slim poll
      # instead of racing its own ODK fetch.
      GLOW_DATA_CACHE_PATH: ${GLOW_DATA_CACHE_PATH:-.cache.parquet}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - api_db
      - public
    restart: "no"
    command:
      - sh
      - -c
      - |
        echo "Waiting for api's first counts poll to reach cache..."
        for i in $$(seq 1 60); do
          [ -s "$$GLOW_DATA_CACHE_PATH" ] && break
          sleep 2
        done
        glow-api demo reset
        # /query and /export only read pinned vintages, and the vintages
        # directory starts empty - cut one now rather than waiting for the
        # scheduler.
        glow-api vintages cut

  dashboard:
    ports:
      - "3000:3000"
    build:
      target: dev
    command: npm run dev -- --host 0.0.0.0 --port 3000
    working_dir: /app
    volumes:
      - ./dashboard:/app
      - dashboard_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      # VITE_-prefixed here (unlike compose.yml's bare PUBLIC_*): the dev
      # target runs Vite's dev server directly, with no nginx/entrypoint
      # templating into config.json, so runtimeConfig.ts's import.meta.env
      # fallback is what actually picks these up, and Vite only exposes
      # VITE_-prefixed vars to import.meta.env.
      VITE_PUBLIC_API_BASE: ${PUBLIC_API_BASE:-http://127.0.0.1:8000}
      # Dev-only: shows the role-picker login instead of redirecting to a
      # (likely unconfigured) real identity provider. Pairs with the api
      # service's GLOW_DEMO_MODE above.
      VITE_PUBLIC_DEMO_MODE: "true"
      PUBLIC_API_BASE: ${PUBLIC_API_BASE:-http://127.0.0.1:8000}
    healthcheck:
      # Override compose.yml's wget-based check: the dev target runs on a
      # plain node:22-bookworm-slim base with neither wget nor curl.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/en/login').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # compose.yml defaults ODK to production wiring (SSL_TYPE=upstream behind
  # the proxy); dev keeps ODK's own self-signed TLS on published ports.
  nginx:
    ports:
      - "${ODK_HTTP_PORT:-8080}:80"
      - "${ODK_HTTPS_PORT:-8443}:443"
    environment:
      DOMAIN: ${ODK_DOMAIN:-odk.local}
      SSL_TYPE: ${ODK_SSL_TYPE:-selfsign}
      EXTRA_SERVER_NAMES: " localhost 127.0.0.1"

  odk-service:
    depends_on:
      mail:
        condition: service_started
    environment:
      EMAIL_HOST: mail
      EMAIL_PORT: "1025"
      EMAIL_SECURE: "false"
      EMAIL_IGNORE_TLS: "true"
      DOMAIN: ${ODK_DOMAIN:-odk.local}
      HTTPS_PORT: ${ODK_PUBLIC_HTTPS_PORT:-8443}

  enketo:
    environment:
      DOMAIN: ${ODK_DOMAIN:-odk.local}
      HTTPS_PORT: ${ODK_PUBLIC_HTTPS_PORT:-8443}

  postgres14:
    image: ${GLOW_REGISTRY:-ghcr.io/oxwrc}/glow-odk-postgres-demo:${GLOW_VERSION:-dev}
    build:
      target: dev

  # Dev/test-only SMTP sink; production sets GLOW_SMTP_* instead.
  mail:
    logging: *default-logging
    image: axllent/mailpit:v1.27
    networks:
      - odk_internal
    restart: unless-stopped

volumes:
  dashboard_node_modules:
