# Development overrides for compose.yml.

services:
  api:
    working_dir: /app
    volumes:
      - ./data:/data
      - ./api:/app
    environment:
      GLOW_CORS_ORIGINS: ${GLOW_CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}
      # Fixed dev-only ODK creds -- match the admin/API users baked into
      # postgres14's dev image (see odk-central/postgres/README.md). Basic
      # Auth requires HTTPS, so this goes through nginx, not odk-service
      # directly.
      GLOW_ODK_API_URL: https://nginx
      GLOW_ODK_HOST_HEADER: odk.local
      GLOW_ODK_API_EMAIL: api@glow.local
      GLOW_ODK_API_PASSWORD: devpassword
      GLOW_ODK_VERIFY_SSL: "false"
      # Dev-only: mints local tokens via /demo/login instead of requiring
      # a real Cognito pool for local dev/demo.
      GLOW_DEMO_MODE: "true"
      # Vintages live in S3 only; dev uses the s3mock service below (same
      # setup as compose.test.yml). Without these, cutting a vintage 503s and
      # /query + /export have nothing to read.
      <<: &dev-vintages-s3
        GLOW_VINTAGES_S3_BUCKET: glow-vintages-dev
        GLOW_AWS_REGION: us-east-1
        AWS_ACCESS_KEY_ID: glow-dev
        AWS_SECRET_ACCESS_KEY: glow-dev-secret
        AWS_ENDPOINT_URL_S3: http://s3mock:9090
    networks:
      - vintages_s3
    depends_on:
      s3mock:
        condition: service_healthy

  glow-init:
    extends:
      file: compose.glow-init.yml
      service: glow-init
    working_dir: /app
    volumes:
      - ./api:/app
    environment:
      GLOW_METADATA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-glow}:${POSTGRES_PASSWORD:-change-me-in-production}@api-db:5432/${POSTGRES_DB:-glow}
      # Same counts cache file api itself writes to (shared via the /app bind
      # mount above) -- lets `demo reset` seed schools from api's slim poll
      # instead of racing its own ODK fetch.
      GLOW_DATA_CACHE_PATH: ${GLOW_DATA_CACHE_PATH:-.cache.parquet}
      <<: *dev-vintages-s3
    depends_on:
      api:
        condition: service_healthy
    networks:
      - api_db
      - public
      - vintages_s3
    restart: "no"
    command:
      - sh
      - -c
      - |
        echo "Waiting for api's first counts poll to reach cache..."
        for i in $$(seq 1 60); do
          [ -s "$$GLOW_DATA_CACHE_PATH" ] && break
          sleep 2
        done
        glow-api demo reset
        # /query and /export only read pinned vintages, and s3mock starts
        # empty - cut one now rather than waiting for the scheduler.
        glow-api vintages cut

  dashboard:
    build:
      target: dev
    command: npm run dev -- --host 0.0.0.0 --port 3000
    working_dir: /app
    volumes:
      - ./dashboard:/app
      - dashboard_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      # VITE_-prefixed here (unlike compose.yml's bare PUBLIC_*): the dev
      # target runs Vite's dev server directly, with no nginx/entrypoint
      # templating into config.json, so runtimeConfig.ts's import.meta.env
      # fallback is what actually picks these up, and Vite only exposes
      # VITE_-prefixed vars to import.meta.env.
      VITE_PUBLIC_API_BASE: ${PUBLIC_API_BASE:-http://127.0.0.1:8000}
      # Dev-only: shows the role-picker login instead of redirecting to a
      # (likely unconfigured) real Cognito hosted UI. Pairs with the api
      # service's GLOW_DEMO_MODE above.
      VITE_PUBLIC_DEMO_MODE: "true"
    healthcheck:
      # Override compose.yml's wget-based check: the dev target runs on a
      # plain node:22-bookworm-slim base with neither wget nor curl.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/en/login').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  nginx:
    environment:
      EXTRA_SERVER_NAMES: " localhost 127.0.0.1"

  postgres14:
    build:
      target: dev

  # Stand-in for the Terraform-provisioned vintages bucket. In-memory: it
  # starts empty on each `up`, and glow-init cuts a fresh vintage.
  s3mock:
    image: adobe/s3mock:5.2.3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIALBUCKETS: glow-vintages-dev
    networks:
      - vintages_s3
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  dashboard_node_modules:

networks:
  vintages_s3:
