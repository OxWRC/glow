name: Smoke test

on:
  push:
    branches:
      - "main"
  pull_request:

jobs:
  release-render-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - name: Test release renderer
        run: uv run --with pyyaml --with pytest pytest scripts/release -q

  glowctl:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: glowctl
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: glowctl/go.mod
          cache-dependency-path: glowctl/go.mod
      - run: go vet ./...
      - run: go test ./...

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compute ODK postgres dev image cache key
        id: odk-image-key
        run: |
          # Image name in the key: a renamed image must miss the cache, or compose rebuilds it without the LFS dump.
          img=$(docker compose -f compose.yml -f compose.test.yml config --images postgres14)
          echo "key=odk-postgres-dev-${img//[:\/]/-}-${{ hashFiles('odk-central/postgres/Dockerfile', 'odk-central/postgres/bake-seed.sh', 'odk-central/postgres/seed/dev-seed.dump') }}" >> "$GITHUB_OUTPUT"

      - name: Restore cached ODK postgres dev image
        id: odk-image-cache
        uses: actions/cache@v5
        with:
          path: /tmp/odk-postgres-dev.tar
          key: ${{ steps.odk-image-key.outputs.key }}

      - name: Pull seed dump (cache miss only)
        if: steps.odk-image-cache.outputs.cache-hit != 'true'
        run: git lfs pull --include odk-central/postgres/seed/dev-seed.dump

      - name: Build ODK postgres dev image (cache miss only)
        if: steps.odk-image-cache.outputs.cache-hit != 'true'
        run: |
          docker compose -f compose.yml -f compose.test.yml build postgres14
          docker save "$(docker compose -f compose.yml -f compose.test.yml config --images postgres14)" -o /tmp/odk-postgres-dev.tar

      - name: Load cached ODK postgres dev image (cache hit only)
        if: steps.odk-image-cache.outputs.cache-hit == 'true'
        run: docker load -i /tmp/odk-postgres-dev.tar

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci
      - name: Install Playwright browsers
        working-directory: dashboard
        run: npx playwright install --with-deps chromium
      - name: Check compose structure
        run: bash scripts/check_compose.sh
      - name: Bring up compose stack and run API smoke checks
        env:
          PLAYWRIGHT_SCOPED_SCHOOL: Beahanberg High School
          # Leave the stack up for the browser tests below.
          GLOW_SMOKE_KEEP_UP: "1"
        run: bash scripts/smoke_compose.sh
      - name: Run dashboard browser smoke tests
        working-directory: dashboard
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          PLAYWRIGHT_SCOPED_SCHOOL: Beahanberg High School
        run: npm run test:e2e
      - name: Tear down compose stack
        if: always()
        run: docker compose -f compose.yml -f compose.test.yml down -v --remove-orphans
