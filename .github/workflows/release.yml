name: Release

on:
  push:
    tags: ["v*.*.*"]

# First release checklist: GHCR packages pushed with GITHUB_TOKEN start private.
# After the first push set each glow-* package to Public and link it to this
# repo (package settings); the "Verify anonymous pull" step fails otherwise.
permissions: {}

env:
  GLOW_VERSION: ${{ github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        # One entry per image built from this repo. Keep in step with the
        # `image:` names in compose.yml / compose.demo.yml (add glow-backup here).
        include:
          - { image: glow-api, context: ./api }
          - { image: glow-dashboard, context: ./dashboard }
          - { image: glow-odk-postgres, context: ./odk-central/postgres, target: base }
          - { image: glow-odk-postgres-demo, context: ./odk-central/postgres, target: dev }
          - { image: glow-enketo, context: ./odk-central/enketo }
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true # the demo postgres image bakes in the LFS seed dump
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute registry
        run: echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ matrix.image }}:${{ env.GLOW_VERSION }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: Resolve image digests
        run: |
          set -euo pipefail
          export GLOW_REGISTRY="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          echo "GLOW_REGISTRY=$GLOW_REGISTRY" >> "$GITHUB_ENV"
          export GLOW_OIDC_ISSUER=x GLOW_OIDC_CLIENT_ID=x
          # The image list comes from compose itself: ours and third-party.
          { docker compose --profile '*' -f compose.yml config --images
            docker compose --profile '*' -f compose.yml -f compose.demo.yml config --images
          } | sort -u > images.txt
          echo '{}' > digests.json
          while read -r ref; do
            digest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest.Digest}}' | tr -d '"')
            repo=${ref%:*}
            jq --arg k "$ref" --arg v "$repo@$digest" '.[$k] = $v' digests.json > d.tmp && mv d.tmp digests.json
          done < images.txt
          cat digests.json

      - uses: actions/setup-go@v6
        with:
          go-version-file: glowctl/go.mod
          cache-dependency-path: glowctl/go.mod

      - name: Build glowctl
        working-directory: glowctl
        run: |
          set -euo pipefail
          mkdir -p ../glowctl-bin
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=$GLOW_VERSION" \
              -o "../glowctl-bin/glowctl-linux-$arch" .
          done

      - name: Stage and render release archive
        run: |
          set -euo pipefail
          uv run --with pyyaml bash scripts/release/stage_release.sh glow-stage "$GLOW_VERSION" "$GLOW_REGISTRY" digests.json
          install -m 0755 glowctl-bin/glowctl-linux-amd64 glow-stage/glowctl

      - name: Validate rendered compose files
        run: |
          set -euo pipefail
          export GLOW_OIDC_ISSUER=https://x GLOW_OIDC_CLIENT_ID=x
          certs=$(mktemp -d)
          cd glow-stage
          docker compose -f compose.yml -f compose.demo.yml config -q
          for mode in acme files off; do
            GLOW_TLS_MODE=$mode GLOW_TLS_CERT_DIR="$certs" docker compose -f compose.yml config -q
          done

      - name: Create archive and offline bundle
        run: |
          set -euo pipefail
          mkdir assets
          tar czf "assets/glow-$GLOW_VERSION.tar.gz" --transform "s,^glow-stage,glow-$GLOW_VERSION," glow-stage
          jq -r '.[]' digests.json | sort -u > pinned.txt
          while read -r ref; do docker pull --platform linux/amd64 "$ref"; done < pinned.txt
          # Name each image by both its tag ref and digest ref so loading works on
          # stores that drop digest-only names.
          jq -r 'to_entries[] | "\(.value) \(.key)"' digests.json | sort -u > pairs.txt
          while read -r dref tref; do docker tag "$dref" "$tref"; done < pairs.txt
          { cat pinned.txt; jq -r 'keys[]' digests.json; } | sort -u > saveset.txt
          xargs docker save < saveset.txt | gzip | split -b 1900M -d - "assets/glow-images-$GLOW_VERSION.tar.gz.part-"
          cp digests.json assets/digests.json
          cp glowctl-bin/glowctl-linux-amd64 glowctl-bin/glowctl-linux-arm64 assets/
          cp glow-stage/glow.env.example assets/
          (cd assets && sha256sum ./* | sed "s, \./, ," > ../SHA256SUMS)
          mv SHA256SUMS assets/SHA256SUMS && cat assets/SHA256SUMS && ls -l assets

      - name: Verify anonymous pull works
        run: |
          set -euo pipefail
          docker logout ghcr.io
          while read -r ref; do
            case "$ref" in ghcr.io/"${GITHUB_REPOSITORY_OWNER,,}"/glow-*) ;; *) continue ;; esac
            docker manifest inspect "$ref" > /dev/null || {
              echo "::error::$ref is not publicly pullable. Set the glow-* GHCR packages to Public (see header of release.yml)."
              exit 1
            }
          done < pinned.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GLOW_VERSION" --title "$GLOW_VERSION" --generate-notes assets/*
