name: E2E lifecycle

# install -> backup -> wipe -> restore -> update -> failed update rolls back,
# against locally built images (scripts/e2e_lifecycle.sh).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-go@v6
        with:
          go-version-file: glowctl/go.mod
          cache-dependency-path: glowctl/go.mod
      - uses: astral-sh/setup-uv@v6
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - name: Lifecycle
        run: scripts/e2e_lifecycle.sh
