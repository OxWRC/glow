name: API Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Host TZ must not affect behaviour (BST-1 is a POSIX TZ string).
        TZ: [UTC, BST-1, Pacific/Auckland]
    env:
      TZ: ${{ matrix.TZ }}
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -e ".[test,dev]"

      - name: Run tests
        run: pytest
